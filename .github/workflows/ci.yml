name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestion
          POSTGRES_PASSWORD: gestion_local
          POSTGRES_DB: gestion_proyectos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gestion" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gestion:gestion_local@localhost:5432/no_usada
      TEST_DATABASE_URL: postgres://gestion:gestion_local@localhost:5432/gestion_proyectos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
